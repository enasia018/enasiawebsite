<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - EnAsia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: #fff; text-align: center; padding: 50px; }
        .login-box { background-color: #222; border: 2px solid #ff3333; padding: 20px; max-width: 350px; margin: auto; border-radius: 10px; text-align: left; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { background-color: #ff3333; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .error { color: #ff3333; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="color: #ff3333; text-align: center;">Admin Login</h2>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <br><a href="{{ url_for('home') }}" style="color: #ff3333; text-decoration: none;">← Back to Home</a>
</body>
</html>
