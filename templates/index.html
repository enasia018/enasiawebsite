<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnAsia Tourist Transport & Van Rental</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='images/your_van_photo.jpeg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .nav-buttons {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #ff3333;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .header {
            margin-bottom: 30px;
        }
        .logo {
            max-width: 220px;
            height: auto;
        }
        h1 {
            color: #ff3333;
            margin-top: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        p {
            font-size: 1.2em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 30px;
            width: 100%;
        }
        .card {
            background-color: rgba(34, 34, 34, 0.9);
            border: 3px solid #ff3333;
            border-radius: 12px;
            padding: 15px;
            width: 90%;
            max-width: 1000px;
            box-shadow: 0px 4px 15px rgba(255, 51, 51, 0.3);
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
        <a href="{{ url_for('franchise') }}" class="btn">Apply for Franchise</a>
        <a href="{{ url_for('rental') }}" class="btn">Book Van Rental</a>
        <a href="{{ url_for('tour_package') }}" class="btn">Tour Package</a>
        <a href="{{ url_for('gcash_page') }}" class="btn">Pay GCash</a>
        <a href="{{ url_for('check_status') }}" class="btn">Check Status</a>
        <a href="{{ url_for('vans_list') }}" target="_blank" class="btn">Van List Status</a>
    </div>

    <!-- Header Section with Logo -->
    <div class="header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EnAsia Logo" class="logo">
        <h1>EnAsia Tourist Transport & Van Rental</h1>
        <p>Driven by Safety, Defined by Trust</p>
    </div>

    <!-- Gallery with Large Full-Window Pictures -->
    <h2>Our Promos & Services</h2>
    <div class="gallery">
        <div class="card">
            <img src="{{ url_for('static', filename='images/van1.jpeg') }}" alt="Van Rental Services">
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='images/rates.jpeg') }}" alt="Rental Rates">
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='images/tour.jpeg') }}" alt="Tour Packages">
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='images/promo.jpeg') }}" alt="Promo Banner">
        </div>
    </div>

</body>
</html>
