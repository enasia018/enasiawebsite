<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff3333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #333;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Van Availability</h2>
        <ul>
            {% for van in vans %}
                <li>
                    <span>{{ van.name }}</span>
                    {% if van.status == 'Available' %}
                        <span style="color: #4CAF50; font-weight: bold;">Available</span>
                    {% else %}
                        <span style="color: #ff4d4d; font-weight: bold;">Reserved</span>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
