<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Application - EnAsia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #222;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff3333;
        }
        h2 {
            color: #ff3333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        .btn {
            background-color: #ff3333;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .btn-gcash {
            background-color: #007bff;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            color: white;
            margin-top: 15px;
        }
        .btn-gcash:hover {
            background-color: #0056b3;
        }
        .success-box {
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        {% if success %}
            <div class="success-box">
                <h2>Application Submitted Successfully!</h2>
                <p>Thank you for booking our tour package. Please proceed to pay your reservation fee via GCash to secure your slots.</p>
                <a href="{{ url_for('tour_gcash') }}" class="btn-gcash">Pay Reservation via GCash</a>
                <br>
                <a href="{{ url_for('home') }}" class="btn" style="background-color: #555; text-decoration: none; display: block;">Back to Home</a>
            </div>
        {% else %}
            <h2>Tour Package Application</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" name="full_name" required>
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" name="address" required>
                </div>
                <div class="form-group">
                    <label>Contact Number:</label>
                    <input type="text" name="contact" required>
                </div>
                <div class="form-group">
                    <label>Email Address (Optional):</label>
                    <input type="email" name="email">
                </div>
                <div class="form-group">
                    <label>Tour Package:</label>
                    <input type="text" name="tour_package" value="Casiguran Aurora x Casapsapan Beach (2D1N)" readonly>
                </div>
                <div class="form-group">
                    <label>Date of Tour:</label>
                    <input type="date" name="tour_date" required>
                </div>
                <div class="form-group">
                    <label>Number of Persons (Pax):</label>
                    <input type="number" name="pax" min="1" required>
                </div>
                <button type="submit" class="btn">Submit Application</button>
            </form>
            <br>
            <a href="{{ url_for('tour_package') }}" style="color: #ff3333; text-decoration: none;">← Back to Tour Details</a>
        {% endif %}
    </div>

</body>
</html>
