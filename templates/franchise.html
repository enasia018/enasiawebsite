<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchise Options - EnAsia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            padding: 20px;
            margin: 0;
        }
        .main-layout {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            max-width: 1200px;
            margin: 20px auto;
            gap: 30px;
            flex-wrap: wrap;
        }
        .left-image {
            flex: 1.2;
            min-width: 350px;
            text-align: left;
        }
        .left-image img {
            width: 100%;
            max-width: 550px;
            border-radius: 10px;
            border: 2px solid #ff3333;
            object-fit: cover;
            display: block;
        }
        .container {
            flex: 1;
            min-width: 300px;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff3333;
            text-align: center;
        }
        .option-box {
            background: #333;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #444;
        }
        .option-box h3 {
            color: #ff3333;
            margin-top: 0;
        }
        .btn {
            background-color: #ff3333;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #cc0000;
        }
        .btn-apply {
            background-color: #4CAF50;
            color: white;
            padding: 6px 14px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-apply:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- Left Side Image -->
        <div class="left-image">
            <img src="{{ url_for('static', filename='images/franchise-banner.jpg') }}" alt="Franchise Banner">
        </div>

        <!-- Right Side Franchise Content -->
        <div class="container">
            <h2>Franchise Opportunities</h2>
            <p>Choose your preferred investment option below:</p>

            <!-- Loop through franchise options from the database -->
            {% for option in options %}
            <div class="option-box">
                <h3>{{ option.title }}</h3>
                <p>{{ option.details }}</p>
                
                <a href="{{ url_for('franchise_apply', option_id=loop.index) }}" class="btn-apply">Apply for Option {{ loop.index }}</a>
            </div>
            {% endfor %}

            <br>
            <a href="{{ url_for('home') }}" class="btn">← Back to Home</a>
        </div>
    </div>

</body>
</html>
